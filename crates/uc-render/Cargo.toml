[package]
name = "uc-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wgpu renderer for Urban Chaos worlds: mipmapped textures, alpha cut-outs, fog, frustum culling"

[dependencies]
uc-world = { path = "../uc-world" }
uc-formats = { path = "../uc-formats" }
wgpu = "30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
font8x8 = { version = "0.3", default-features = false }
