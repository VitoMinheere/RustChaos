[package]
name = "uc-formats"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Readers for Urban Chaos (1999) data files: maps, missions, texture clumps, prims, wall styles"

[features]
# Missions as JSON (adds serde).
json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
